name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Une seule exécution par branche : les poussées successives annulent la précédente.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Les quatre étapes ci-dessous sont celles de « make verify », dans le même ordre.
      # Un test du dépôt (tests/test_depot.py) vérifie que le Makefile et ce fichier ne divergent pas.
      - name: Contrôles de couverture
        run: python dan-cortex/skills/lancer-projet/scripts/cortex.py plugin verifier

      - name: Tests unitaires
        run: python -m unittest discover -s tests -v

      - name: Archive livrée à jour
        run: python scripts/construire_plugin.py --verifier

      - name: Audit du gabarit de réglages
        run: python -I dan-cortex/skills/robustesse-agents/scripts/robustesse.py audit-config --path dan-cortex/skills/robustesse-agents/assets/reglages-autonomes.json

      - name: Aucun fichier généré ne doit différer
        run: git diff --exit-code
